<!doctype html>
<html lang="it" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<meta name="google" content="notranslate">
<link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Diamant"><meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<title>Diamant Showroom 3D</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: full-bleed 3D stage with the arbor upright; stack editor floats left, tool rail right, catalogue strip along the bottom. Single dark showroom look, tablet landscape first. */
:root{
  --ink:#070b12;
  --ink-2:#0f1626;
  --line:rgba(150,178,230,.16);
  --fg:#e9eef7;
  --mute:#8d9ab0;
  --blue:#3a68c6;
  --blue-hi:#8fb0ee;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --glass:rgba(13,20,34,.66);
  --pw:min(330px,34vw);
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--fg);overflow:hidden}
body{font-family:var(--f-body);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;touch-action:none;
  background:
    radial-gradient(ellipse 50% 60% at 62% 46%, #182640 0%, rgba(14,22,38,.6) 45%, transparent 75%),
    repeating-radial-gradient(circle at 62% 46%, transparent 0 79px, rgba(143,176,238,.045) 80px),
    var(--ink)}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg, transparent calc(62% - .5px), rgba(143,176,238,.07) 62%, transparent calc(62% + .5px))}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line)}
button:focus-visible{outline:2px solid var(--blue-hi);outline-offset:2px}

/* top bar */
.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 28px 0 22px;pointer-events:none;z-index:6}
.logo{color:#fff;transition:padding .3s}
#app.fs .logo{padding-left:84px}
.logo{display:flex;align-items:center;gap:16px}
.logo svg.lockup{height:40px;width:auto;display:block}
.logo .mii{display:flex;align-items:center;gap:9px;padding-left:16px;border-left:1px solid rgba(255,255,255,.18);height:30px;font:600 11px/1 var(--f-mono);letter-spacing:.3em;text-transform:uppercase;color:#cfd6e3;white-space:nowrap}
.logo .tri{display:inline-flex;gap:2px;height:16px}
.logo .tri b{display:block;width:5px;height:100%;border-radius:2px;background:linear-gradient(180deg,#19b36a,#0a8f52)}
.logo .tri b:nth-child(2){background:linear-gradient(180deg,#ffffff,#d8dce3)}
.logo .tri b:nth-child(3){background:linear-gradient(180deg,#e8384a,#b8232f)}
.topr{display:flex;gap:10px;pointer-events:auto}
.pill{height:44px;min-width:44px;border-radius:22px;color:var(--fg);font:500 13px/1 var(--f-mono);letter-spacing:.08em;
  display:inline-flex;align-items:center;justify-content:center;padding:0 4px;cursor:pointer;touch-action:manipulation}
.lang{position:relative}
.lang .pill{gap:8px;padding:0 16px 0 12px}
.lang .pill[aria-expanded="true"]{background:var(--fg);color:var(--ink)}
.menu{position:absolute;right:0;top:52px;min-width:190px;max-height:calc(100vh - 118px);max-height:calc(100dvh - 118px);border-radius:20px;padding:6px;display:flex;flex-direction:column;gap:2px;z-index:20;animation:swap .25s cubic-bezier(.2,.7,.2,1)}
.menu[hidden]{display:none!important}
/* scroll container with pinned actions: the language list scrolls inside, Vista/Schermo stay at the bottom; the box stops above the wheel strip */
.menu .scroll{display:flex;flex-direction:column;gap:2px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;min-height:0;flex:1 1 auto}
.menu .scroll button,.menu .fixed button{flex:0 0 44px}
.menu .fixed{flex:0 0 auto;display:flex;flex-direction:column;gap:2px}
#app.open-b #l-menu{max-height:calc(100vh - 272px);max-height:calc(100dvh - 272px)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 8px}
.menu button{all:unset;display:flex;align-items:center;justify-content:space-between;gap:16px;height:44px;padding:0 14px;border-radius:14px;font-size:15px;cursor:pointer;touch-action:manipulation}
.menu button small{font:500 11px/1 var(--f-mono);letter-spacing:.1em;color:var(--mute);margin-left:auto}
.menu button .fl{font-size:19px;line-height:1;margin-right:10px;width:24px;text-align:center}
.menu button .ico{width:24px;margin-right:10px;display:grid;place-items:center}.menu button .ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.menu button{justify-content:flex-start}
.menu button[aria-checked="true"]{background:rgba(58,104,198,.3)}
.menu button[aria-checked="true"] small{color:var(--blue-hi)}
.menu button:active{background:rgba(143,176,238,.15)}
.pill svg{width:20px;height:20px}

/* left panel */
.panel{position:absolute;left:0;top:calc(env(safe-area-inset-top,0px) + 96px);bottom:calc(env(safe-area-inset-bottom,0px) + var(--dockh,176px) + 18px);box-sizing:border-box;padding:16px 14px 16px 18px;
  width:var(--pw);display:flex;flex-direction:column;gap:10px;z-index:4;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-left:0;border-right:0;border-radius:0;overflow:hidden;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
#app:not(.open-l) .panel{transform:translateX(-100%);pointer-events:none}
.panel.drag,.tab.drag,.dock.drag{transition:none !important}
.panel>*{pointer-events:auto}
.panel[hidden]{display:none!important}
.eyebrow{font:500 11.5px/1.4 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--blue-hi);display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--blue-hi)}
h1{font-family:var(--f-display);font-variation-settings:"wdth" 108;font-weight:700;font-size:clamp(26px,2.8vw,38px);line-height:.98;letter-spacing:-.015em;margin:10px 0 0;text-wrap:balance}
.meta{font:500 12px/1.5 var(--f-mono);letter-spacing:.06em;color:var(--mute);margin-top:8px;font-variant-numeric:tabular-nums}
.meta b{color:var(--fg);font-weight:500}
.meta b.over{color:#f3b3b3}

.list{list-style:none;margin:0;padding:2px;display:flex;flex-direction:column;gap:5px;overflow-y:auto;min-height:56px;flex:1 1 0;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.panel>:not(.list){flex:none}
.list::after{content:"";flex:none;height:2px}
.row{display:grid;grid-template-columns:40px 34px minmax(0,1fr) 40px 40px;column-gap:4px;align-items:center;height:44px;flex:0 0 44px;border-radius:14px;padding-right:2px;cursor:grab;touch-action:pan-y;
  transition:background .25s,border-color .25s,transform .15s,box-shadow .2s}
.row.sel{border-color:var(--blue-hi);background:rgba(58,104,198,.26)}
.row.locked{background:repeating-linear-gradient(-45deg,rgba(143,176,238,.07) 0 6px,transparent 6px 12px),var(--glass);cursor:default}
.row.locked.sel{background:repeating-linear-gradient(-45deg,rgba(143,176,238,.1) 0 6px,transparent 6px 12px),rgba(58,104,198,.26)}
.row.cand{animation:cand 1.1s ease-in-out infinite;border-color:#f0b35a}
.row.dim{opacity:.35}
@keyframes cand{0%,100%{box-shadow:0 0 0 0 rgba(240,179,90,0)}50%{box-shadow:0 0 0 4px rgba(240,179,90,.35)}}
.row.drag{transform:scale(1.04);box-shadow:0 14px 30px -12px rgba(0,0,0,.8);border-color:var(--blue-hi);cursor:grabbing;z-index:2}
.row .grip{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mute);cursor:grab;touch-action:none;border-right:1px solid var(--line);border-radius:14px 0 0 14px}
.row .grip:active{background:rgba(143,176,238,.15)}
.row .grip svg{width:14px;height:10px;fill:currentColor;opacity:.8}
.row .num{font:500 11px/1 var(--f-mono);color:var(--fg);text-align:center;letter-spacing:.04em}
.row.locked .grip{cursor:default;opacity:.5}
.row.locked .num{color:var(--blue-hi)}
.row img{-webkit-user-drag:none;width:34px;height:26px;object-fit:contain;filter:drop-shadow(0 4px 5px rgba(0,0,0,.5));pointer-events:none}
.row .nm{display:flex;flex-direction:column;gap:2px;min-width:0;padding-left:4px}
.row .nm b{font-size:13.5px;line-height:1.1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{font:500 11px/1 var(--f-mono);color:var(--mute);white-space:nowrap}
.row button{all:unset;box-sizing:border-box;cursor:pointer;touch-action:manipulation;height:40px;width:40px;display:grid;place-items:center;color:#c2cbdb;border-radius:12px}
.row button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row button:active{background:rgba(143,176,238,.15)}
.row .lk[aria-pressed="true"]{color:var(--blue-hi)}
.row .del{color:#9aa6ba}
.row .del:active{color:#f3b3b3}
.empty{border:1px dashed rgba(143,176,238,.35);border-radius:14px;padding:16px 14px;font-size:13.5px;line-height:1.45;color:var(--mute);text-align:center}
.empty.over{border-color:var(--blue-hi);color:var(--fg);background:rgba(58,104,198,.18)}
.actions{display:flex;flex-wrap:nowrap;gap:6px}
.actions .btn{padding:0 8px;font-size:12.5px;height:40px;flex:1 1 0;min-width:0;justify-content:center;gap:6px;white-space:nowrap}
.actions .btn svg{flex:none;width:16px;height:16px}
.cones{display:flex;gap:7px;margin-top:2px}
.cones button{all:unset;box-sizing:border-box;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 11px;border-radius:15px;cursor:pointer;touch-action:manipulation;border:1px solid var(--line);background:rgba(143,176,238,.05);transition:background .25s,border-color .25s,transform .25s}
.cones button:active{transform:scale(.97)}
.cones img{width:80px;height:62px;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.cones span{display:flex;flex-direction:column;align-items:center;min-width:0;line-height:1.15;text-align:center}
.cones b{font-size:14px;line-height:1.15;white-space:nowrap;text-align:center;max-width:100%}.cones small{font:500 12px/1.2 var(--f-mono);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cones button[aria-pressed="true"]{border-color:var(--blue-hi);background:linear-gradient(180deg,rgba(58,104,198,.38),rgba(58,104,198,.22));box-shadow:0 0 0 1px rgba(143,176,238,.25) inset,0 10px 24px -14px rgba(58,104,198,.9)}
.cones button[aria-pressed="true"] small{color:var(--blue-hi)}
.space{height:4px;border-radius:2px;background:rgba(143,176,238,.14);margin-top:10px;overflow:hidden}
.space i{display:block;height:100%;width:0;border-radius:2px;background:var(--blue-hi);transition:width .5s cubic-bezier(.2,.7,.2,1),background .3s}
.space.warn i{background:#f0b35a}.space.over i{background:#e05555}
.card.nofit{opacity:.3}
.hdr{display:flex;align-items:center;gap:6px;margin-top:10px}
.hdr.foot{margin-top:auto;justify-content:space-between;padding-top:8px;border-top:1px solid var(--line)}
.hdr.foot .pre .menu{top:auto;bottom:46px}
.hdr .meta{margin:0;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.hdr button{all:unset;box-sizing:border-box;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#c2cbdb;cursor:pointer;touch-action:manipulation;position:relative}
.hdr button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hdr button:disabled{opacity:.25;cursor:default}
.hdr button:not(:disabled):active{background:rgba(143,176,238,.15)}
.pre{position:relative}
.pre .menu{left:auto;right:0;top:46px;min-width:190px}
.pre .menu button{white-space:nowrap;justify-content:flex-start}
.btn{all:unset;height:44px;padding:0 16px;border-radius:22px;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;cursor:pointer;touch-action:manipulation;transition:background .2s}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--blue);border:1px solid var(--blue-hi)}
.btn:disabled{opacity:.35;cursor:default}
.btn:not(:disabled):active{transform:scale(.97)}
.presets{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.presets span{font:500 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-right:2px}
.gctl{display:flex;flex-direction:column;gap:8px;margin:2px 0 4px}
.gctl .seg{align-self:flex-start}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip[aria-pressed="true"]{background:rgba(58,104,198,.4);border-color:var(--blue-hi);color:#fff}
.chip small{font:500 11px/1 var(--f-mono);color:var(--mute);margin-left:6px}
.chip[aria-pressed="true"] small{color:#dfe4ec}
.chip{all:unset;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;touch-action:manipulation}
.chip:active{background:rgba(143,176,238,.15)}

.desc{font-size:15.5px;line-height:1.5;color:#c2cbdb;margin:6px 0 0;max-width:34ch}
dl.specs{margin:0;display:grid;grid-template-columns:auto 1fr;border-top:1px solid var(--line)}
dl.specs dt,dl.specs dd{padding:10px 0;border-bottom:1px solid var(--line);margin:0}
dl.specs dt{font:500 11px/1.6 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding-right:20px}
dl.specs dd{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.swap{animation:swap .5s cubic-bezier(.2,.7,.2,1)}
@keyframes swap{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* tool rail */
.tools{display:flex;gap:8px;pointer-events:auto}
.tool{all:unset;box-sizing:border-box;width:64px;height:56px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;
  font:500 11px/1 var(--f-mono);letter-spacing:.01em;text-transform:uppercase;color:#c2cbdb;transition:background .25s,border-color .25s,transform .15s,opacity .25s;touch-action:manipulation}
.tool svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tool:active{transform:scale(.95)}
.tool[aria-pressed="true"]{background:var(--blue);border-color:var(--blue-hi);color:#fff;box-shadow:0 10px 30px -10px rgba(58,104,198,.9)}
.tool[aria-disabled="true"]{opacity:.28;pointer-events:none}

/* explode labels */
#snap{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;z-index:2}
#snap[hidden]{display:none}
#labels{position:absolute;inset:0;pointer-events:none;z-index:3}
.back{all:unset;position:absolute;left:calc(var(--pw) + 38px + 16px);top:calc(env(safe-area-inset-top,0px) + 96px);z-index:8;display:flex;align-items:center;gap:10px;padding:12px 20px 12px 14px;border-radius:30px;font-family:var(--f-display);font-weight:600;font-size:15px;cursor:pointer;touch-action:manipulation;background:rgba(58,104,198,.9);border:1px solid rgba(143,176,238,.5)}
.back svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.back[hidden],#app:not(.single) .back{display:none}
#app:not(.open-l) .back{left:54px}
.garr{all:unset;position:absolute;top:50%;transform:translateY(-50%);width:52px;height:88px;border-radius:18px;display:grid;place-items:center;z-index:4;cursor:pointer;color:#dfe4ec;touch-action:manipulation}
.garr svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.garr-l{left:calc(var(--pw) + 38px + 14px)}#app:not(.open-l) .garr-l{left:52px}.garr-r{right:16px}
#app:not(.single) .garr,#app.show .garr{display:none}
#app.single .hint{display:none}
.empty{cursor:pointer}
.lab.w .tag{pointer-events:auto;cursor:pointer}
#app.ro .lab.w .tag{pointer-events:none}
.arrow{all:unset;position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border-radius:16px;display:grid;place-items:center;z-index:4;cursor:pointer;color:#c2cbdb;opacity:.55;transition:opacity .3s,left .45s cubic-bezier(.2,.7,.2,1),right .45s cubic-bezier(.2,.7,.2,1);touch-action:manipulation}
.arrow svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.arrow:active{opacity:1}
.arrow-l{left:52px}.arrow-r{right:16px}
#app.open-l .arrow-l{left:324px}
#app.show .arrow,#app.ro .arrow,#app.single .arrow,#app.repl .arrow{opacity:0;pointer-events:none}
.arrow.pulse{animation:arrowpulse 1.4s ease-in-out 2}
@keyframes arrowpulse{0%,100%{opacity:.55}50%{opacity:1;transform:translateY(-50%) scale(1.15)}}
.lab{position:absolute;left:0;top:0;opacity:0;transition:opacity .35s;will-change:transform}
.lab .dot{position:absolute;left:-3.5px;top:-3.5px;width:7px;height:7px;border-radius:50%;background:var(--blue-hi);box-shadow:0 0 0 4px rgba(143,176,238,.18)}
.lab .stem{position:absolute;left:0;top:0;height:1px;width:38px;background:linear-gradient(to right,var(--blue-hi),rgba(143,176,238,.3))}
.lab .tag{position:absolute;left:40px;top:0;transform:translateY(-50%);white-space:nowrap;padding:6px 11px 6px 10px;border-left:2px solid var(--blue-hi);background:rgba(10,16,28,.84);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:13px;font-weight:600}
.lab .tag em{font:500 11px/1 var(--f-mono);font-style:normal;color:var(--mute);margin-left:8px;letter-spacing:.04em}

/* catalogue strip */
.dock{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:auto;min-width:min(420px,calc(100% - 32px));max-width:calc(100% - 32px);padding:0 12px calc(env(safe-area-inset-bottom,0px) + 8px);border-radius:24px 24px 0 0;border-bottom:0;display:flex;flex-direction:column;gap:6px;z-index:5;transition:opacity .3s}
#app.show .dock,#app.ro .dock{display:none}
#app:not(.open-b) .dock{transform:translate(-50%,calc(100% - 32px))}
#app:not(.open-b) .dock .famrow,#app:not(.open-b) .dock .sizes{pointer-events:none}
.railb{height:32px;display:flex;align-items:center;justify-content:center;gap:10px;font:600 12px/1 var(--f-mono);letter-spacing:.24em;text-transform:uppercase;color:#dfe4ec;cursor:pointer;touch-action:none;margin:0 -10px}
.railb svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
#app.open-b .railb svg{transform:rotate(180deg)}
.dock{transition:transform .45s cubic-bezier(.2,.7,.2,1),opacity .3s}
#app.open-b .handle{bottom:calc(env(safe-area-inset-bottom,0px) + 194px)}
.handle[hidden]{display:none}
#app:not(.open-b) .panel{bottom:calc(env(safe-area-inset-bottom,0px) + 54px)}
.dock .body{display:flex;align-items:stretch;gap:10px;padding:0}
.dock .strip{flex:0 0 auto;flex-direction:column;gap:2px;justify-content:center;padding-right:10px;border-right:1px solid var(--line)}
.dock .card.famc{flex-direction:row;width:auto;padding:3px 12px 3px 6px;gap:8px;border-radius:12px;align-items:center;justify-content:flex-start}
.dock .card.famc img{width:34px;height:25px}
.dock .card.famc b{font-size:12.5px;white-space:nowrap}.dock .card.famc small{display:none}
.sizes{flex:0 1 auto;min-width:0;display:flex;align-items:center;gap:12px}
.sizes .vrow{flex:0 1 auto;justify-content:flex-start;min-width:0;gap:4px;align-items:center}
.sizes .seg{flex:0 0 auto;flex-direction:column;align-self:center;gap:4px;padding:3px;border-left:1px solid var(--line);border-radius:0;background:none;border-top:0;border-right:0;border-bottom:0;padding-left:12px;margin-left:2px}
.sizes .seg button{text-align:left;padding:9px 12px}
.sizes .seg:empty{display:none}
.strip{display:flex;gap:6px}

function grain(size, spread, sparkles){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); const img = g.createImageData(size, size); const d = img.data;
  for (let i = 0; i < d.length; i += 4){ const v = 128 + (Math.random() - .5) * spread; d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255; }
  g.putImageData(img, 0, 0);
  for (let i = 0; i < sparkles; i++){ g.fillStyle = `rgba(255,255,255,${.4 + Math.random()*.6})`; g.fillRect(Math.random()*size|0, Math.random()*size|0, 1, 1); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; return t;
}
function stripes(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  if (w > h) for (let x = 0; x < w; x++){ const v = 120 + Math.random()*40; g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(x, 0, 1, h); }
  else for (let y = 0; y < h; y++){ const v = 118 + Math.random()*44; g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(0, y, w, 1); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; }
function tex(base, rx, ry){ const t = base.clone(); t.needsUpdate = true; t.repeat.set(rx, ry); return t; }

  };

}

/* ================================================================== geometry helpers (mm, axis = Y) */
const V2 = THREE.Vector2, PI = Math.PI;
function lathe(pts, mat, seg = 128, phi0 = 0, phiLen = PI*2){
  // closed polygon [r, y]; corners doubled so edges stay crisp
  let a = 0; for (let i = 0; i < pts.length; i++){ const p = pts[i], q = pts[(i+1)%pts.length]; a += p[0]*q[1] - q[0]*p[1]; }
  if (a < 0) pts = pts.slice().reverse();
  const p0 = pts[0], p1 = pts[1], mid = new V2((p0[0]+p1[0])/2, (p0[1]+p1[1])/2);
  const out = [mid.clone()];
  const add = p => { out.push(new V2(p[0], p[1])); if (!p[2]) out.push(new V2(p[0], p[1])); };
  for (let i = 1; i < pts.length; i++) add(pts[i]);
  add(pts[0]); out.push(mid.clone());
  const mesh = new THREE.Mesh(new THREE.LatheGeometry(out, seg, phi0, phiLen), mat); mesh.userData.prof = pts; return mesh;
}
function shapeOf(pts){ const s = new THREE.Shape(); pts.forEach((p, i) => i ? s.lineTo(p[0], p[1]) : s.moveTo(p[0], p[1])); return s; }
function flatRing(shape, depth, y, mat, bevel = .5){
  const g = new THREE.ExtrudeGeometry(shape, {depth, bevelEnabled:bevel > 0, bevelThickness:bevel, bevelSize:bevel, bevelSegments:2, curveSegments:96});
  g.rotateX(-PI/2); g.translate(0, y, 0);
  return new THREE.Mesh(g, mat);
}
function holedDisk(rOut, rIn, holes){
  const s = new THREE.Shape(); s.absarc(0, 0, rOut, 0, PI*2, false);
  const h = new THREE.Path(); h.absarc(0, 0, rIn, 0, PI*2, true); s.holes.push(h);
  holes.forEach(([a, r, d]) => { const p = new THREE.Path(); p.absarc(Math.cos(a)*r, Math.sin(a)*r, d, 0, PI*2, true); s.holes.push(p); });
  return s;
}
function teeth(pts, count, w, mat){
  const g = new THREE.ExtrudeGeometry(shapeOf(pts), {depth:w, bevelEnabled:true, bevelThickness:.3, bevelSize:.3, bevelSegments:1, curveSegments:1});
  g.translate(0, 0, -w/2);
  const m = new THREE.InstancedMesh(g, mat, count);
  const mx = new THREE.Matrix4(), q = new THREE.Quaternion(), pos = new THREE.Vector3(), sc = new THREE.Vector3(1,1,1), Y = new THREE.Vector3(0,1,0);
  for (let i = 0; i < count; i++){ q.setFromAxisAngle(Y, i / count * PI * 2); mx.compose(pos, q, sc); m.setMatrixAt(i, mx); }
  return m;
}
function thread(y0, y1, rIn, rLo, rHi, pitch){
  const p = [[rIn, y0], [rHi, y0]]; let y = y0, hi = true;
  while (y + pitch/2 < y1 - 1){ y += pitch/2; hi = !hi; p.push([hi ? rHi : rLo, y]); }
  p.push([rHi - .8, y1], [rIn, y1]); return p;
}

function closeFam(){ openFam(CAT.families.find(f => !f.only || f.only === state.cone).id); }
$('fam-ver').addEventListener('click', e => { const b = e.target.closest('[data-ver]'); if (!b || !FAM.open) return; FAM.ver[FAM.open] = b.dataset.ver; openFam(FAM.open); refreshCatalogue(); });
$('strip').addEventListener('click', e => { const c = e.target.closest('.famc'); if (!c || cardBlock) return; closeSheet(); openFam(c.dataset.fam); });
openFam(CAT.families[0].id);

/* catalogue cards: one tap drops the wheel onto the arbor, a double tap opens its sheet, a drag carries it to the arbor */
let tapT = 0, tapK = null;
function addFromCatalogue(k){

  if (!fits(tOf(k))){ if (repl && repl.k === k) setRepl(null); else if (state.stack.some(s => canRepl(s.uid, k))) setRepl(k); else toast(T().full); return; }   // full arbor: pick a wheel to swap instead
  setRepl(null); setTool('explode', false); setTool('section', false);

}
function switchCone(c, keepView){   // the other arbor: each arbor keeps its own set; the catalogue shows its own wheels. keepView: no camera fly (swipe hand-over)
  if (state.ro) return; if (SHOW.on) stopShow(); setRepl(null);

  else flyHome();
  toast(`${T().hero} ${CONE[c].label} · ${CONE[c].sub}`);
}
function refreshCatalogue(){   // thumbnails and visibility follow the active arbor
  document.querySelectorAll('.card[data-k]').forEach(c => { const k = c.dataset.k, w = WHEELS[k]; if (!FAM.open) c.hidden = !!w.only && w.only !== state.cone; c.querySelector('img').src = thumbs[state.cone][k] || ''; });
  document.querySelectorAll('.card.famc').forEach(c => { const f = famOf(c.dataset.fam), ver = famVer(f), ks = f.versions[ver].filter(k => !WHEELS[k].only || WHEELS[k].only === state.cone); c.hidden = !!f.only && f.only !== state.cone; c.querySelector('img').src = thumbs[state.cone][ks[0] || f.versions[ver][0]] || ''; c.querySelector('small').textContent = ks.length === 1 ? `${code(ks[0])} · ${tOf(ks[0])} mm` : `${ks.length} ${T().sizes}`; });

/* focus on one wheel = a gallery: arrows, cards or a one-finger flick move through every wheel of the arbor; "back" returns to exactly the screen you left */
let galleryFrom = null, gal = null;   // gal = {old, neu, t, dur, dir, D}
function swapSingle(k, dir, D, dur){   // build the new wheel beside the current one and let the loop animate the exchange

function morphTo(k){ if (k === state.single || state.mode !== 'single') return; swapSingle(k, 1, 0, .4); }

}
function galleryTo(k, dir){ if (k === state.single || state.mode !== 'single') return; swapSingle(k, dir, cone().R * 3.2, .85); }
function galFams(){ return CAT.families.filter(f => !f.only || f.only === state.cone); }
function famPick(f){ const ver = famVer(f), list = f.versions[ver].filter(k => !WHEELS[k].only || WHEELS[k].only === state.cone); const last = FAM.size && FAM.size[f.id]; return list.includes(last) ? last : list[0]; }
function galleryStep(dir){ const fs = galFams(), i = fs.findIndex(f => f.id === famOfType(state.single).id), n = fs.length; galleryTo(famPick(fs[(i + dir + n) % n]), dir); }
function galleryBack(){ if (state.mode !== 'single') return; const f = galleryFrom || {l:false, b:true}; enterMode('stack', true); state.sel = f.sel && state.stack.some(x => x.uid === f.sel) ? f.sel : null; renderStack(); setOpen('l', f.l); setOpen('b', f.b); flyHome(); }
$('b-back').onclick = galleryBack; $('garr-l').onclick = () => galleryStep(-1); $('garr-r').onclick = () => galleryStep(1);
let flick = null;
canvas.addEventListener('pointerdown', e => { flick = state.mode === 'single' && e.isPrimary ? {x:e.clientX, y:e.clientY, t:performance.now()} : null; }, {passive:true});
canvas.addEventListener('pointerup', e => { if (!flick || state.mode !== 'single') return; const dx = e.clientX - flick.x, dy = e.clientY - flick.y, dt = performance.now() - flick.t; flick = null; if (dt < 450 && Math.abs(dx) > 70 && Math.abs(dy) < Math.abs(dx) * .6) galleryStep(dx < 0 ? 1 : -1); }, {passive:true});
document.querySelectorAll('.card[data-k]').forEach(c => c.onclick = () => {
  if (cardBlock){ cardBlock = false; return; }
  closeSheet();
  const k = c.dataset.k;
  if (state.mode === 'single'){ const fs = galFams(), a = fs.findIndex(f => f.id === famOfType(k).id), b = fs.findIndex(f => f.id === famOfType(state.single).id); if (a === b) morphTo(k); else galleryTo(k, a > b ? 1 : -1); return; }   // in the gallery a card shows that wheel

});
resize();
camera.position.copy(VIEW_DIR).multiplyScalar(14);
enterMode('stack', true);
renderUI();
flyHome();
requestAnimationFrame(t => { last = t; frame(t); setTimeout(() => $('loading').classList.add('done'), 250); });

setInterval(() => { if (document.visibilityState === 'visible' && document.hasFocus() && performance.now() - lastRaw > 45000) location.reload(); }, 5000);   // stalled render loop → reload (not when the tab is merely throttled in the background)
document.addEventListener('visibilitychange', () => { lastRaw = performance.now(); });
let errT = []; addEventListener('error', () => { const n = performance.now(); errT = errT.filter(t => n - t < 60000); errT.push(n); if (errT.length > 12) location.reload(); });
if ('serviceWorker' in navigator && location.hostname !== 'localhost' && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
stat('session'); booted = true; measureDock(); fixDockWidth();
$('langbar').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; $('langbar').hidden = true; try { localStorage.setItem('diamant-langpicked', '1'); } catch(x){} if (b.dataset.more){ setMenu(true); } else { state.lang = b.dataset.l; try { localStorage.setItem('diamant-lang', state.lang); } catch(x){} renderUI(); } if (!guided) $('hint').classList.remove('off'); });
if (state.ro){ $('app').classList.add('ro','open-l'); $('app').classList.remove('open-b'); $('robadge').hidden = false; layoutTargets(); stat('ro-view'); }

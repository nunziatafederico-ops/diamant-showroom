<!doctype html>
<html lang="it" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<meta name="google" content="notranslate">
<link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Diamant"><meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<title>Diamant Showroom 3D</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D stage with the arbor upright; stack editor floats left, tool rail right, catalogue strip along the bottom. Single dark showroom look, tablet landscape first. */
:root{
  --ink:#070b12;
  --ink-2:#0f1626;
  --line:rgba(150,178,230,.16);
  --fg:#e9eef7;
  --mute:#8d9ab0;
  --blue:#3a68c6;
  --blue-hi:#8fb0ee;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --glass:rgba(13,20,34,.66);
  --pw:min(272px,30vw);
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--fg);overflow:hidden}
body{font-family:var(--f-body);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;touch-action:none;
  background:
    radial-gradient(ellipse 50% 60% at 62% 46%, #182640 0%, rgba(14,22,38,.6) 45%, transparent 75%),
    repeating-radial-gradient(circle at 62% 46%, transparent 0 79px, rgba(143,176,238,.045) 80px),
    var(--ink)}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg, transparent calc(62% - .5px), rgba(143,176,238,.07) 62%, transparent calc(62% + .5px))}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line)}
button:focus-visible{outline:2px solid var(--blue-hi);outline-offset:2px}

/* top bar */
.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 28px 0 22px;pointer-events:none;z-index:6}
.logo{color:#fff;transition:padding .3s}
#app.fs .logo{padding-left:84px}
.logo svg.lockup{height:58px;width:auto;display:block}
.topr{display:flex;gap:10px;pointer-events:auto}
.pill{height:44px;min-width:44px;border-radius:22px;color:var(--fg);font:500 13px/1 var(--f-mono);letter-spacing:.08em;
  display:inline-flex;align-items:center;justify-content:center;padding:0 4px;cursor:pointer;touch-action:manipulation}
.lang{position:relative}
.lang .pill{gap:8px;padding:0 16px 0 12px}
.lang .pill[aria-expanded="true"]{background:var(--fg);color:var(--ink)}
.menu{position:absolute;right:0;top:52px;min-width:190px;border-radius:20px;padding:6px;display:flex;flex-direction:column;gap:2px;z-index:20;animation:swap .25s cubic-bezier(.2,.7,.2,1)}
.menu[hidden]{display:none!important}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 8px}
.menu button{all:unset;display:flex;align-items:center;justify-content:space-between;gap:16px;height:44px;padding:0 14px;border-radius:14px;font-size:15px;cursor:pointer;touch-action:manipulation}
.menu button small{font:500 11px/1 var(--f-mono);letter-spacing:.1em;color:var(--mute)}
.menu button[aria-checked="true"]{background:rgba(58,104,198,.3)}
.menu button[aria-checked="true"] small{color:var(--blue-hi)}
.menu button:active{background:rgba(143,176,238,.15)}
.pill svg{width:20px;height:20px}

/* left panel */
.panel{position:absolute;left:24px;top:calc(env(safe-area-inset-top,0px) + 96px);bottom:calc(env(safe-area-inset-bottom,0px) + 150px);
  width:var(--pw);display:flex;flex-direction:column;gap:10px;z-index:4;pointer-events:none;transition:transform .45s cubic-bezier(.2,.7,.2,1),opacity .3s}
#app:not(.open-l) .panel{transform:translateX(calc(-100% - 40px));opacity:0;pointer-events:none}
.panel>*{pointer-events:auto}
.panel[hidden]{display:none!important}
.eyebrow{font:500 11.5px/1.4 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--blue-hi);display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--blue-hi)}
h1{font-family:var(--f-display);font-variation-settings:"wdth" 108;font-weight:700;font-size:clamp(26px,2.8vw,38px);line-height:.98;letter-spacing:-.015em;margin:10px 0 0;text-wrap:balance}
.meta{font:500 12px/1.5 var(--f-mono);letter-spacing:.06em;color:var(--mute);margin-top:8px;font-variant-numeric:tabular-nums}
.meta b{color:var(--fg);font-weight:500}
.meta b.over{color:#f3b3b3}

.list{list-style:none;margin:0;padding:2px;display:flex;flex-direction:column;gap:5px;overflow-y:auto;min-height:98px;flex:1 1 0;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.panel>:not(.list){flex:none}
.list::after{content:"";flex:none;height:2px}
.row{display:grid;grid-template-columns:40px 34px minmax(0,1fr) 40px 40px;column-gap:4px;align-items:center;height:44px;flex:0 0 44px;border-radius:14px;padding-right:2px;cursor:grab;touch-action:pan-y;
  transition:background .25s,border-color .25s,transform .15s,box-shadow .2s}
.row.sel{border-color:var(--blue-hi);background:rgba(58,104,198,.26)}
.row.locked{background:repeating-linear-gradient(-45deg,rgba(143,176,238,.07) 0 6px,transparent 6px 12px),var(--glass);cursor:default}
.row.locked.sel{background:repeating-linear-gradient(-45deg,rgba(143,176,238,.1) 0 6px,transparent 6px 12px),rgba(58,104,198,.26)}
.row.drag{transform:scale(1.04);box-shadow:0 14px 30px -12px rgba(0,0,0,.8);border-color:var(--blue-hi);cursor:grabbing;z-index:2}
.row .grip{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mute);cursor:grab;touch-action:none;border-right:1px solid var(--line);border-radius:14px 0 0 14px}
.row .grip:active{background:rgba(143,176,238,.15)}
.row .grip svg{width:14px;height:10px;fill:currentColor;opacity:.8}
.row .num{font:500 11px/1 var(--f-mono);color:var(--fg);text-align:center;letter-spacing:.04em}
.row.locked .grip{cursor:default;opacity:.5}
.row.locked .num{color:var(--blue-hi)}
.row img{-webkit-user-drag:none;width:34px;height:26px;object-fit:contain;filter:drop-shadow(0 4px 5px rgba(0,0,0,.5));pointer-events:none}
.row .nm{display:flex;flex-direction:column;gap:2px;min-width:0;padding-left:4px}
.row .nm b{font-size:13.5px;line-height:1.1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{font:500 11px/1 var(--f-mono);color:var(--mute);white-space:nowrap}
.row button{all:unset;box-sizing:border-box;cursor:pointer;touch-action:manipulation;height:40px;width:40px;display:grid;place-items:center;color:#c2cbdb;border-radius:12px}
.row button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row button:active{background:rgba(143,176,238,.15)}
.row .lk[aria-pressed="true"]{color:var(--blue-hi)}
.row .del{color:#9aa6ba}
.row .del:active{color:#f3b3b3}
.empty{border:1px dashed rgba(143,176,238,.35);border-radius:14px;padding:16px 14px;font-size:13.5px;line-height:1.45;color:var(--mute);text-align:center}
.empty.over{border-color:var(--blue-hi);color:var(--fg);background:rgba(58,104,198,.18)}
.actions{display:flex;flex-wrap:nowrap;gap:6px}
.actions .btn{padding:0 8px;font-size:12.5px;height:40px;flex:1 1 0;min-width:0;justify-content:center;gap:6px;white-space:nowrap}
.actions .btn svg{flex:none;width:16px;height:16px}
.hdr{display:flex;align-items:center;gap:6px;margin-top:10px}
.hdr .meta{margin:0;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.hdr button{all:unset;box-sizing:border-box;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#c2cbdb;cursor:pointer;touch-action:manipulation;position:relative}
.hdr button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hdr button:disabled{opacity:.25;cursor:default}
.hdr button:not(:disabled):active{background:rgba(143,176,238,.15)}
.pre{position:relative}
.pre .menu{left:auto;right:0;top:46px;min-width:190px}
.pre .menu button{white-space:nowrap;justify-content:flex-start}
.btn{all:unset;height:44px;padding:0 16px;border-radius:22px;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;cursor:pointer;touch-action:manipulation;transition:background .2s}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--blue);border:1px solid var(--blue-hi)}
.btn:disabled{opacity:.35;cursor:default}
.btn:not(:disabled):active{transform:scale(.97)}
.presets{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.presets span{font:500 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-right:2px}
.chip{all:unset;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;touch-action:manipulation}
.chip:active{background:rgba(143,176,238,.15)}

.desc{font-size:15.5px;line-height:1.5;color:#c2cbdb;margin:6px 0 0;max-width:34ch}
dl.specs{margin:0;display:grid;grid-template-columns:auto 1fr;border-top:1px solid var(--line)}
dl.specs dt,dl.specs dd{padding:10px 0;border-bottom:1px solid var(--line);margin:0}
dl.specs dt{font:500 11px/1.6 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding-right:20px}
dl.specs dd{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.swap{animation:swap .5s cubic-bezier(.2,.7,.2,1)}
@keyframes swap{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* tool rail */
.tools{display:flex;gap:8px;pointer-events:auto}
.tool{all:unset;box-sizing:border-box;width:56px;height:56px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;
  font:500 9px/1 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:#c2cbdb;transition:background .25s,border-color .25s,transform .15s,opacity .25s;touch-action:manipulation}
.tool svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tool:active{transform:scale(.95)}
.tool[aria-pressed="true"]{background:var(--blue);border-color:var(--blue-hi);color:#fff;box-shadow:0 10px 30px -10px rgba(58,104,198,.9)}
.tool[aria-disabled="true"]{opacity:.28;pointer-events:none}

/* explode labels */
#labels{position:absolute;inset:0;pointer-events:none;z-index:3}
.lab{position:absolute;left:0;top:0;opacity:0;transition:opacity .35s;will-change:transform}
.lab .dot{position:absolute;left:-3.5px;top:-3.5px;width:7px;height:7px;border-radius:50%;background:var(--blue-hi);box-shadow:0 0 0 4px rgba(143,176,238,.18)}
.lab .stem{position:absolute;left:0;top:0;height:1px;width:38px;background:linear-gradient(to right,var(--blue-hi),rgba(143,176,238,.3))}
.lab .tag{position:absolute;left:40px;top:0;transform:translateY(-50%);white-space:nowrap;padding:6px 11px 6px 10px;border-left:2px solid var(--blue-hi);background:rgba(10,16,28,.84);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:13px;font-weight:600}
.lab .tag em{font:500 11px/1 var(--f-mono);font-style:normal;color:var(--mute);margin-left:8px;letter-spacing:.04em}

/* catalogue strip */
.strip{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);display:flex;gap:6px;z-index:5;transition:transform .45s cubic-bezier(.2,.7,.2,1),opacity .3s}
#app:not(.open-b) .strip{transform:translate(-50%,calc(100% + 100px));opacity:0;pointer-events:none}
.strip{
  padding:7px;border-radius:24px;max-width:calc(100% - 32px);overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.card{all:unset;flex:0 0 auto;width:100px;touch-action:pan-x;border-radius:17px;padding:5px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:background .25s;touch-action:manipulation;position:relative}
.card img{-webkit-user-drag:none;user-drag:none;width:76px;height:56px;object-fit:contain;display:block;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5));transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.card b{font-size:12.5px;font-weight:600;text-align:center;line-height:1.15}
.card small{font:500 11px/1.1 var(--f-mono);letter-spacing:.02em;color:var(--mute);text-align:center}
.card.hero{width:118px;border-right:1px solid var(--line);border-radius:17px 6px 6px 17px;margin-right:4px}
.card[aria-pressed="true"]{background:rgba(58,104,198,.24)}
.card[aria-pressed="true"] img{transform:scale(1.1)}

.tab{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:72px;display:grid;place-items:center;z-index:7;cursor:pointer;color:#c2cbdb;transition:left .45s cubic-bezier(.2,.7,.2,1),right .45s cubic-bezier(.2,.7,.2,1);touch-action:manipulation;border:1px solid var(--line);padding:0}
.tab svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
.tab-l{left:0;border-radius:0 16px 16px 0;border-left:0}
#app.open-l .tab-l{left:calc(24px + var(--pw) + 8px);border-radius:16px;border-left:1px solid var(--line)}
#app.open-l .tab-l svg{transform:rotate(180deg)}
#app.show .tab,#app.show .handle{opacity:0;pointer-events:none;transition:opacity .6s}
.tab,.handle{transition:opacity .6s}
.handle{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);transform:translateX(-50%);height:30px;padding:0 18px;border-radius:15px;display:flex;align-items:center;gap:8px;z-index:7;cursor:pointer;color:#c2cbdb;font:500 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;touch-action:manipulation;transition:bottom .45s cubic-bezier(.2,.7,.2,1),opacity .6s}
.handle svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
#app.open-b .handle{bottom:calc(env(safe-area-inset-bottom,0px) + 128px)}
#app.open-b .handle svg{transform:rotate(180deg)}
.sect{position:absolute;left:62%;top:calc(env(safe-area-inset-top,0px) + 30px);transform:translateX(-50%);font:500 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--blue-hi);display:flex;align-items:center;gap:10px;opacity:0;transition:opacity .4s;z-index:3;pointer-events:none}
.sect i{width:22px;height:12px;background:linear-gradient(90deg,#8d9098 50%,#2a2d33 50%);border:1px solid var(--blue-hi)}
.sect.on{opacity:1}

/* picker sheet */
.sheet{position:absolute;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(4,7,12,.62);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .25s}
.sheet[hidden]{display:none!important}
@keyframes fade{from{opacity:0}}
.sheet-card{width:min(760px,100%);max-height:100%;overflow:auto;border-radius:28px;padding:24px;background:rgba(13,20,34,.92);border:1px solid var(--line);display:flex;flex-direction:column;gap:18px;animation:swap .35s cubic-bezier(.2,.7,.2,1)}
.sheet-card h2{font-family:var(--f-display);font-variation-settings:"wdth" 108;font-weight:700;font-size:28px;margin:8px 0 0}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.opt{all:unset;border-radius:18px;border:1px solid var(--line);padding:12px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;touch-action:manipulation;transition:background .2s,border-color .2s}
.opt img{width:100%;max-width:120px;aspect-ratio:4/3;object-fit:contain}
.opt b{font-size:14px;font-weight:600}
.opt small{font:500 11px/1.2 var(--f-mono);color:var(--mute);text-align:center}
.opt[aria-disabled="true"]{opacity:.35}
.opt[aria-current="true"]{border-color:var(--blue-hi);background:rgba(58,104,198,.22)}
.opt:active{background:rgba(143,176,238,.12)}
.sheet-card footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn.ghost{border:1px solid var(--line)}
.btn.danger{border:1px solid rgba(240,140,140,.35);color:#f3b3b3}

.dragghost{position:fixed;left:0;top:0;width:96px;height:72px;pointer-events:none;z-index:30;transform:translate(-50%,-60%) scale(1.15);filter:drop-shadow(0 18px 22px rgba(0,0,0,.7));transition:opacity .2s}
.dragghost img{width:100%;height:100%;object-fit:contain}
#app.dropping canvas{cursor:copy}
.toast{position:absolute;left:62%;bottom:calc(env(safe-area-inset-bottom,0px) + 140px);transform:translate(-50%,10px);padding:11px 18px;border-radius:22px;background:rgba(10,15,26,.9);border:1px solid var(--line);
  font-size:13.5px;color:#d5dceb;opacity:0;transition:opacity .3s,transform .3s;z-index:7;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hint{position:absolute;left:62%;bottom:calc(env(safe-area-inset-bottom,0px) + 140px);transform:translateX(-50%);display:flex;align-items:center;gap:12px;
  padding:12px 18px;border-radius:24px;font-size:13.5px;color:#c2cbdb;z-index:4;transition:opacity .6s;pointer-events:none;white-space:nowrap}
.hint svg{width:22px;height:22px;stroke:var(--blue-hi);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;animation:sway 2.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
.hint.off{opacity:0}
.cap{position:absolute;left:28px;top:48%;transform:translate(0,calc(-50% + 14px));text-align:left;z-index:8;pointer-events:none;opacity:0;transition:opacity .9s,transform .9s;max-width:min(40vw,620px)}
.cap.on{opacity:1;transform:translate(0,-50%);animation:capIn 1.1s cubic-bezier(.2,.7,.2,1)}
@keyframes capIn{from{filter:blur(14px);letter-spacing:.04em;opacity:0}to{filter:blur(0);letter-spacing:-.02em;opacity:1}}
.cap em{display:block;font:500 13px/1.4 var(--f-mono);font-style:normal;letter-spacing:.22em;text-transform:uppercase;color:var(--blue-hi);margin-bottom:10px}
.cap b{display:block;font-family:var(--f-display);font-variation-settings:"wdth" 112;font-weight:700;font-size:clamp(34px,5vw,70px);line-height:1;letter-spacing:-.02em;text-wrap:balance;text-shadow:0 10px 40px rgba(0,0,0,.6)}
#app.show .panel,#app.show .strip,#app.show .tools,#app.show .hint,#app.show #labels,#app.show .sect{opacity:0;pointer-events:none;transition:opacity .6s}
.panel,.strip,.tools{transition:opacity .6s}
.attract{position:absolute;inset:0;z-index:9;display:flex;align-items:flex-end;justify-content:flex-start;padding:0 0 calc(env(safe-area-inset-bottom,0px) + 84px) 28px;opacity:0;pointer-events:none;transition:opacity .8s}
.attract.on{opacity:1;pointer-events:auto}
.attract div{font-family:var(--f-display);font-variation-settings:"wdth" 125;font-weight:600;font-size:15px;letter-spacing:.24em;text-transform:uppercase;
  padding:18px 30px;border-radius:40px;background:rgba(58,104,198,.92);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(143,176,238,.45)}70%{box-shadow:0 0 0 26px rgba(143,176,238,0)}100%{box-shadow:0 0 0 0 rgba(143,176,238,0)}}
.loading{position:absolute;inset:0;z-index:20;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .7s}
.loading svg{width:52px;height:62px;color:#fff;animation:breathe 1.6s ease-in-out infinite}
.loading p{font:500 11px/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin:0}
.loading.done{opacity:0;pointer-events:none}
@keyframes breathe{50%{opacity:.45;transform:scale(.94)}}

@media (max-aspect-ratio:1/1), (max-width:760px){
  #app{background:radial-gradient(ellipse 80% 40% at 50% 62%, #182640 0%, transparent 75%),var(--ink)}

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;

renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.035).texture;
scene.environmentIntensity = 1.25;
const key = new THREE.DirectionalLight(0xfff4e6, 2.2); key.position.set(-3, 5, 4); scene.add(key);
const rimL = new THREE.DirectionalLight(0x7fa3ff, 2.2); rimL.position.set(4, 1.5, -4); scene.add(rimL);
const fill = new THREE.DirectionalLight(0xbfd2ff, .6); fill.position.set(2, -3, 3); scene.add(fill);
const glow = new THREE.PointLight(0x4f7fe0, 0, 12, 1.6); scene.add(glow);   // the show's roaming accent light

const camera = new THREE.PerspectiveCamera(30, 1, .05, 100);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = .07; controls.enablePan = true; controls.screenSpacePanning = true; controls.panSpeed = .9;
controls.touches = {ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN};
controls.rotateSpeed = .75; controls.zoomSpeed = .9; controls.autoRotateSpeed = .55;

/* ================================================================== materials */
function grain(size, spread, sparkles){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); const img = g.createImageData(size, size); const d = img.data;
  for (let i = 0; i < d.length; i += 4){ const v = 128 + (Math.random() - .5) * spread; d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255; }
  g.putImageData(img, 0, 0);
  for (let i = 0; i < sparkles; i++){ g.fillStyle = `rgba(255,255,255,${.4 + Math.random()*.6})`; g.fillRect(Math.random()*size|0, Math.random()*size|0, 1, 1); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; return t;
}
function stripes(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  if (w > h) for (let x = 0; x < w; x++){ const v = 120 + Math.random()*40; g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(x, 0, 1, h); }
  else for (let y = 0; y < h; y++){ const v = 118 + Math.random()*44; g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(0, y, w, 1); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; }
function tex(base, rx, ry){ const t = base.clone(); t.needsUpdate = true; t.repeat.set(rx, ry); return t; }
const gFine = grain(256, 170, 600), gCoarse = grain(256, 230, 1200), gBrush = stripes(512, 8), gTurn = stripes(8, 1024);

const sectionPlane = new THREE.Plane(new THREE.Vector3(0,0,-1), 50);
renderer.clippingPlanes = [sectionPlane];
function patch(m){
  m.side = THREE.DoubleSide;
  m.onBeforeCompile = s => {
    s.fragmentShader = s.fragmentShader.replace('#include <dithering_fragment>', `#include <dithering_fragment>
      if(!gl_FrontFacing){ gl_FragColor = vec4(diffuseColor.rgb * .62 + vec3(.03), 1.); }`);
  };
  return m;
}
const M = {

  plated: patch(new THREE.MeshStandardMaterial({color:0x8e8b86, metalness:.55, roughness:.66, roughnessMap:tex(gCoarse,22,3), bumpMap:tex(gCoarse,22,3), bumpScale:1.4})),
  sinter: patch(new THREE.MeshStandardMaterial({color:0x5d5c59, metalness:.35, roughness:.82, roughnessMap:tex(gCoarse,.09,.09), bumpMap:tex(gCoarse,.09,.09), bumpScale:1.4})),
  bronze: patch(new THREE.MeshStandardMaterial({color:0xc89d5f, metalness:.85, roughness:.34, bumpMap:tex(gTurn,1,1), bumpScale:.4})),
  brass:  patch(new THREE.MeshStandardMaterial({color:0xd9b866, metalness:1, roughness:.24})),

  const add = p => { out.push(new V2(p[0], p[1])); if (!p[2]) out.push(new V2(p[0], p[1])); };
  for (let i = 1; i < pts.length; i++) add(pts[i]);
  add(pts[0]); out.push(mid.clone());

}
function shapeOf(pts){ const s = new THREE.Shape(); pts.forEach((p, i) => i ? s.lineTo(p[0], p[1]) : s.moveTo(p[0], p[1])); return s; }

}
function holedDisk(rOut, rIn, holes){

  holes.forEach(([a, r, d]) => { const p = new THREE.Path(); p.absarc(Math.cos(a)*r, Math.sin(a)*r, d, 0, PI*2, true); s.holes.push(p); });
  return s;
}
function teeth(pts, count, w, mat){
  const g = new THREE.ExtrudeGeometry(shapeOf(pts), {depth:w, bevelEnabled:true, bevelThickness:.3, bevelSize:.3, bevelSegments:1, curveSegments:1});
  g.translate(0, 0, -w/2);

  for (let i = 0; i < count; i++){ q.setFromAxisAngle(Y, i / count * PI * 2); mx.compose(pos, q, sc); m.setMatrixAt(i, mx); }

}
function thread(y0, y1, rIn, rLo, rHi, pitch){
  const p = [[rIn, y0], [rHi, y0]]; let y = y0, hi = true;

  p.push([rHi - .8, y1], [rIn, y1]); return p;
}

/* rim profile on the outer diameter, read from the "Vista in sezione A-A" of each drawing */
function rimPts(w, rIn){
  const t = w.t;

    return [[rIn,0],[99.4,0],[100,.6],[100,L],[100-d,L+d],[100-d,t-L-d],[100,t-L],[100,t-.6],[99.4,t],[rIn,t]]; }
  if (w.prof === 'p') return [[rIn,0],[98,0],[100,2],[100,5],[98.6,5.6],[98.6,6.4],[100,7],[100,10],[98,12],[rIn,12]];
  const L = w.L, c = t/2;
  return [[rIn,0],[100,0],[100,L],[97,L+3],[97,c-1.5],[99.5,c-.5],[99.5,c+.5],[97,c+1.5],[97,t-L-3],[100,t-L],[100,t],[rIn,t]];
}
function arcText(g, txt, r, top, size, weight, spacing){
  // letters along a circle of radius r (px), centred on the vertical axis; top = outer arc read left→right, else bottom arc
  g.font = `${weight} ${size}px Archivo, Helvetica, Arial, sans-serif`;
  const w = [...txt].map(ch => (g.measureText(ch).width + spacing) / r), total = w.reduce((x, y) => x + y, 0) - spacing / r;
  let cum = 0;
  [...txt].forEach((ch, i) => {

    g.save(); g.translate(512 + Math.cos(a)*r, 512 - Math.sin(a)*r); g.rotate(top ? PI/2 - a : 3*PI/2 - a); g.fillText(ch, 0, 0); g.restore();
    cum += w[i];

}
const decalCache = {};
function decalTex(variant){ // 'cont' (no PATENTED, rim from r86) | 'pat' | 'nopat'
  if (decalCache[variant]) return decalCache[variant];
  const S = 1024, c = document.createElement('canvas'); c.width = c.height = S; const g = c.getContext('2d');
  const px = S/200;                                   // 5.12 px per mm, the canvas spans the full Ø200
  const ink = 'rgba(22,26,34,.95)'; g.fillStyle = ink; g.strokeStyle = ink; g.textAlign = 'center'; g.textBaseline = 'middle';
  // everything sits on the vertical axis of the face, between the Ø47.5 washer and the rim (r86 continuous, r93 the others)
  const rt = (variant === 'cont' ? 79 : 85) * px;                         // text arcs
  const rl = (variant === 'cont' ? 62 : 66) * px, hl = 18*px;             // the "D": centre radius and height (18 mm)
  const k = hl/101.26, ox = 512 - 41.5*k - 16.78*k, oy = 512 - rl - hl/2 - 12.14*k;
  const R = (x, y, w, h) => g.fillRect(ox + x*k, oy + y*k, w*k, h*k);
  const P = pts => { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(ox + p[0]*k, oy + p[1]*k) : g.moveTo(ox + p[0]*k, oy + p[1]*k)); g.closePath(); g.fill(); };
  R(16.78,12.14,18.3,18.3); R(39.95,12.14,36.61,18.3); R(16.78,35.31,18.3,54.91); R(81.43,35.31,18.3,54.91); R(39.95,35.31,36.88,54.91);
  P([[81.43,12.14],[81.43,30.44],[99.73,30.44]]); R(16.78,95.09,18.3,18.3); R(39.95,95.09,36.61,18.3); P([[81.43,113.4],[99.73,95.09],[81.43,95.09]]);
  arcText(g, 'MADE IN ITALY', rt, true, 6*px, 600, 2.4*px);
  if (variant === 'pat') arcText(g, 'PATENTED', rt, false, 6.4*px, 700, 3.2*px);

}
function decal(w, t){
  const variant = w.prof === 'v' ? 'cont' : (w.prof === 'pencil' ? 'pat' : 'nopat');
  const m = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({map: decalTex(variant), transparent:true, depthWrite:false, metalness:.2, roughness:.9, polygonOffset:true, polygonOffsetFactor:-2}));

}
function buildWheel(type){
  const w = WHEELS[type], t = w.t, g = new THREE.Group();
  g.add(decal(w, t));
  if (w.kind === 'settori'){
    const holes = []; for (let i = 0; i < 6; i++) holes.push([i/6*PI*2, 62, 3.25]);
    g.add(flatRing(holedDisk(93, 17.5, holes), t - 1, .5, M.face, .5));
    g.add(teeth(rimPts(w, 93.3), 57, 5, M.sinter));
  } else {
    const rimIn = w.kind === 'cont' ? 86 : 93;
    g.add(lathe([[18.5,0],[rimIn,0],[rimIn,t],[18.5,t],[17.5,t-1],[17.5,1]], M.face));
    const pts = rimPts(w, rimIn + .3), mat = w.rim === 'bronze' ? M.bronze : M.plated;
    if (w.kind === 'cont') g.add(lathe(pts, mat));
    else {
      const d = 1.5/96.5, step = PI*2/10, cap = new THREE.ShapeGeometry(shapeOf(pts));
      for (let k = 0; k < 10; k++){
        const p0 = k*step + d, len = step - 2*d;

        [p0, p0 + len].forEach(ph => { const m = new THREE.Mesh(cap, capMat(mat)); m.rotation.y = ph - PI/2; g.add(m); });
      }
    }
  }
  g.userData.t = t;
  return g;
}

/* Forel arbor, proportions taken from the assembly drawing (1:1) */
function buildBase(){
  const g = new THREE.Group();
  g.add(lathe([[14,-67],[20.5,-67],[21.5,-66],[24,-27],[24,-25],[0,-25],[0,-40],[14,-40]], M.steel));
  g.add(lathe([[17.6,-25],[39,-25],[40,-24],[40,-19],[38.4,-18],[38.4,-16],[40,-15],[40,-1],[39,0],[17.6,0]], M.steel));

}
function buildShaft(H){
  const g = new THREE.Group();
  g.add(lathe([[0,-24],[17.4,-24],[17.4,H+3],[0,H+3]], M.steelM, 96));
  g.add(lathe(thread(H+3, H+17, 0, 16.4, 17.4, 2), M.steel, 96));
  const hole = new THREE.Mesh(new THREE.CircleGeometry(2.4, 24), M.darkFlat); hole.rotation.x = -PI/2; hole.position.y = H + 17.03; g.add(hole);

function buildWasher(){ return lathe([[17.9,0],[47.5,0],[47.5,2.5],[44,6],[18.4,6],[17.9,5.5]], M.steel); }
function buildNut(){
  const hex = new THREE.Shape();

  const hh = new THREE.Path(); hh.absarc(0, 0, 17.8, 0, PI*2, true); hex.holes.push(hh);

}

/* ================================================================== state */
let uidSeq = 1;
const mk = (type, locked = false) => ({uid: uidSeq++, type, locked});
const state = {lang:'it', mode:'stack', single:'V33', stack:[], sel:null, explode:false, section:false, spin:false};
function loadStack(){
  try { const s = JSON.parse(localStorage.getItem('diamant-stack-v2'));
    if (Array.isArray(s) && s.length <= MAX_WHEELS && s.every(x => WHEELS[x.type])) return s.map(x => mk(x.type, !!x.locked)); } catch(e){}
  return [];
}
function saveStack(){ try { localStorage.setItem('diamant-stack-v2', JSON.stringify(state.stack.map(({type, locked}) => ({type, locked})))); } catch(e){} }
state.stack = loadStack();
const stackH = () => state.stack.reduce((a, s) => a + WHEELS[s.type].t, 0);

/* reorder that respects locked slots: only unlocked items move, into unlocked slots */
function moveTo(uid, slot){
  const st = state.stack, from = st.findIndex(s => s.uid === uid);
  if (from < 0 || st[from].locked || st[slot].locked || from === slot) return false;
  const free = st.map((s, i) => s.locked ? -1 : i).filter(i => i >= 0);
  const items = free.map(i => st[i]); const item = items.splice(free.indexOf(from), 1)[0];
  items.splice(free.indexOf(slot), 0, item);
  free.forEach((i, j) => st[i] = items[j]); return true;
}
function shuffle(){
  const st = state.stack, free = st.map((s, i) => s.locked ? -1 : i).filter(i => i >= 0);
  if (free.length < 2){ toast(T().nothing); return; }
  const items = free.map(i => st[i]); let perm = items;
  for (let n = 0; n < 12; n++){ perm = items.slice(); for (let i = perm.length - 1; i > 0; i--){ const j = Math.random()*(i+1)|0; [perm[i], perm[j]] = [perm[j], perm[i]]; }
    if (perm.some((x, j) => x.type !== items[j].type)) break; }
  free.forEach((i, j) => st[i] = perm[j]); syncStack(); toast(T().shuffled);
}

/* ================================================================== scene graph */
const MM = .01, GAP = 26;
const root = new THREE.Group(), spin = new THREE.Group(); root.add(spin); root.scale.setScalar(MM); scene.add(root);
const shadowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  const r = g.createRadialGradient(64,64,0,64,64,64); r.addColorStop(0,'rgba(0,0,0,.6)'); r.addColorStop(.6,'rgba(0,0,0,.2)'); r.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle = r; g.fillRect(0,0,128,128); return new THREE.CanvasTexture(c); })();
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(1,1), new THREE.MeshBasicMaterial({map:shadowTex, transparent:true, depthWrite:false}));
shadow.rotation.x = -PI/2; scene.add(shadow);
const halo = new THREE.Mesh(new THREE.TorusGeometry(107, .9, 8, 180), new THREE.MeshBasicMaterial({color:0x8fb0ee, transparent:true}));
halo.rotation.x = PI/2;

const W = new Map();           // uid -> {g, type, y, base, kb}
let base = null, shaft = null, shaftH = -1, washer = null, nut = null, single = null;
let washerY = 0, viewC = 0, viewR = 1.2;
function disposeTree(o){ o.traverse(c => { if (c.geometry && c.geometry !== halo.geometry) c.geometry.dispose(); }); }
function clearSpin(){ [...spin.children].forEach(c => { spin.remove(c); if (c !== halo) disposeTree(c); }); W.clear(); base = shaft = washer = nut = single = null; shaftH = -1; }

function enterMode(mode, instant){
  state.mode = mode; clearSpin(); spin.rotation.y = 0;
  if (mode === 'stack'){
    base = buildBase(); washer = buildWasher(); nut = buildNut(); spin.add(base, washer, nut, halo);
    syncStack(instant !== false);
  } else {
    single = buildWheel(state.single); spin.add(single);
    if (state.explode) setTool('explode', false);
  }
  $('t-explode').setAttribute('aria-disabled', mode !== 'stack');
  $('p-stack').hidden = mode !== 'stack'; $('p-single').hidden = mode !== 'single';
  document.querySelectorAll('.card').forEach(c => c.setAttribute('aria-pressed', mode === 'stack' ? c.dataset.k === 'stack' : c.dataset.k === state.single));
  renderSingle(); buildLabels();
}
function syncStack(instant){
  if (state.mode !== 'stack') return;
  const live = new Set(state.stack.map(s => s.uid));
  for (const [uid, o] of W) if (!live.has(uid) && !o.leaving){ o.leaving = true; if (o.vanish) continue; o.base = o.base + 110; o.kb = 0; const d = o.g.getObjectByName('decal'); if (d) d.visible = true; }
  let y = 0; const n = state.stack.length;
  for (let i = n - 1; i >= 0; i--){
    const s = state.stack[i]; let o = W.get(s.uid);
    if (o && o.type !== s.type){ spin.remove(o.g); disposeTree(o.g); W.delete(s.uid); o = null; }
    if (!o){ const g = buildWheel(s.type); spin.add(g); o = {g, type:s.type, y: instant ? y : y + 75, entering: !instant}; g.position.y = o.y; W.set(s.uid, o); }
    o.base = y; o.kb = n - 1 - i; y += WHEELS[s.type].t + .1;
    const d = o.g.getObjectByName('decal'); if (d) d.visible = i === 0;   // only the top face is visible in the stack
  }

  if (!state.stack.some(s => s.uid === state.sel)) state.sel = null;
  saveStack(); renderStack(); buildLabels();
}

let drag = null;
const list = $('list');
list.addEventListener('click', e => {
  if (clickBlock){ clickBlock = false; return; }
  const row = e.target.closest('.row'); if (!row) return; const uid = +row.dataset.uid, s = state.stack.find(x => x.uid === uid);
  if (e.target.closest('.lk')){ s.locked = !s.locked; syncStack(); return; }

  if (state.sel === uid){ openSheet({mode:'replace', uid}); return; }

});
let clickBlock = false, pressT = 0, pend = null;
list.addEventListener('pointerdown', e => {
  const row = e.target.closest('.row'); if (!row || e.target.closest('button')) return;
  const uid = +row.dataset.uid, s = state.stack.find(x => x.uid === uid); if (s.locked) return;
  pend = {uid, id:e.pointerId, x:e.clientX, y:e.clientY};
  const start = () => { pend = null; drag = {uid, id:e.pointerId}; clickBlock = true; try { list.setPointerCapture(e.pointerId); } catch(x){} state.sel = uid; renderStack(); };
  if (e.target.closest('.grip')){ e.preventDefault(); start(); return; }   // the handle drags at once, mouse or finger
  if (e.pointerType === 'mouse') pend.start = start;            // mouse: drag as soon as it moves

  rows.forEach((r, i) => { const b = r.getBoundingClientRect(), d = Math.abs(e.clientY - (b.top + b.height/2)); if (d < best){ best = d; slot = i; } });
  const from = state.stack.findIndex(s => s.uid === drag.uid);

});

  if (!SHOW.on) return;
  SHOW.on = false; caption(-1); nutAside = false; SHOW.nut = null; glowTarget = 0; glow.intensity = 0;
  $('attract').classList.remove('on'); $('app').classList.remove('show'); $('t-show').setAttribute('aria-pressed', false);
  setTool('explode', false); setTool('section', false); setTool('spin', false);
  state.stack = SHOW.saved.map(x => mk(x.type, x.locked)); state.sel = null;
  for (const [uid, o] of W){ spin.remove(o.g); disposeTree(o.g); W.delete(uid); }
  nut.rotation.set(0, 0, 0); washer.rotation.set(0, 0, 0); spin.rotation.y = 0;
  syncStack(true); controls.enabled = true; resize(); flyHome();
}
function tickShow(dt){
  SHOW.t += dt;
  if (SHOW.t >= SHOW_LEN){ SHOW.t = 0; SHOW.i = 0; for (const [uid, o] of W){ spin.remove(o.g); disposeTree(o.g); W.delete(uid); } state.stack = []; }
  while (SHOW.i < EV.length && SHOW.t >= EV[SHOW.i][0]){ EV[SHOW.i][1](); SHOW.i++; }
  // camera on rails
  const [turns, phi, dm, ly] = camAt(SHOW.t);
  const dist = fitDist() * dm * (wide() ? 1.0 : 1.12);
  camera.position.setFromSphericalCoords(dist, phi, SHOW.theta + turns * PI * 2 * .35);
  camera.position.y += (ly - viewC) * MM * .35;
  camera.lookAt(0, (ly - viewC) * MM * .35, 0);
  // the accent light circles the set
  glow.intensity += (glowTarget - glow.intensity) * (1 - Math.pow(.1, dt));
  glow.position.set(Math.cos(SHOW.t*.9)*2.2, .9 + .5*Math.sin(SHOW.t*.6), Math.sin(SHOW.t*.9)*2.2);
}
/* per-frame placement of wheels (and the nut) while the show runs: two-leg tweens through the hub + a separation guard */
function applyPoses(dt){
  const n = state.stack.length;
  const lerpP = (A, B, u) => ({x:A.x + (B.x - A.x)*u, y:A.y + (B.y - A.y)*u, z:A.z + (B.z - A.z)*u, rx:A.rx + (B.rx - A.rx)*u, ry:A.ry + (B.ry - A.ry)*u, rz:A.rz + (B.rz - A.rz)*u});
  const place = (p, o) => { const ang = (p.ry || 0) + (p.a || 0); return {x:p.x*Math.cos(ang), y:p.y, z:p.x*Math.sin(ang), rx:p.rx, ry:p.face ? ang : 0, rz:p.rz}; };
  for (const o of W.values()){
    if (o.vanish) continue;
    if (o.grow){ const sc = o.g.scale.x + (1 - o.g.scale.x) * (1 - Math.pow(.002, dt)); o.g.scale.setScalar(sc); if (sc > .995){ o.g.scale.setScalar(1); o.grow = false; } }
    o.cur = o.cur || {x:0, y:0, z:0, rx:0, ry:0, rz:0, a:0, sp:0};
    const c = o.cur;
    if (SHOW.on){
      // a new destination becomes active at its scheduled time: capture where we are, route via the hub
      if (o.next && SHOW.t >= o.nextAt){
        const tgt = o.next; o.next = null; o.pose = tgt; o.t0 = SHOW.t;
        o.from = {x:c.x, y:c.y, z:c.z, rx:c.rx, ry:c.ry, rz:c.rz};
        const hubY = Math.max(HUB_Y - o.y, c.y, tgt.y) ; o.hub = {x:0, y: (tgt === HOME || (o.from.x === 0 && o.from.z === 0 && tgt.x === 0)) ? Math.max(HUB_Y - o.y, c.y) : HUB_Y - o.y, z:0, rx:0, ry:c.ry, rz:0};
        const d = place(Object.assign({}, tgt, {a:c.a}), o); o.to = {x:d.x, y:d.y, z:d.z, rx:d.rx, ry:d.ry, rz:d.rz};
        o.oneLeg = (o.from.x === 0 && o.from.z === 0 && d.x === 0 && d.z === 0);   // axis to axis: a single straight leg
      }
      if (o.pose && o.t0 != null){
        const el = SHOW.t - o.t0, p = o.pose;
        if (p.orbit) c.a += dt * p.orbit;
        let q;
        if (o.oneLeg) q = lerpP(o.from, o.to, ease3(el / (LEG*1.4)));
        else if (el < LEG) q = lerpP(o.from, o.hub, ease3(el / LEG));
        else q = lerpP(o.hub, o.to, ease3((el - LEG) / LEG));
        if (el >= (o.oneLeg ? LEG*1.4 : 2*LEG) && p !== HOME){ const d = place(Object.assign({}, p, {a:c.a}), o); q = {x:d.x, y:d.y, z:d.z, rx:d.rx, ry:d.ry, rz:d.rz}; }  // formation keeps turning
        c.x = q.x; c.y = q.y; c.z = q.z; c.rx = q.rx; c.ry = q.ry; c.rz = q.rz;
        c.sp += ((p.spin || 0) - c.sp) * (1 - Math.pow(.01, dt)); c.own = (c.own || 0) + c.sp * dt;
        if (p === HOME && el >= 2*LEG){ c.a = 0; }
      }
    } else { const k = 1 - Math.pow(.0015, dt); c.x *= 1 - k; c.y *= 1 - k; c.z *= 1 - k; c.rx *= 1 - k; c.rz *= 1 - k; c.sp = 0; o.pose = null; o.next = null; o.t0 = null; }
    const scr = (SHOW.on && o.pose && o.pose.screen) ? Math.atan2(camera.position.x, camera.position.z) - spin.rotation.y : 0;
    o.g.position.x = c.x + (o.outX ? right.x * o.outX : 0); o.g.position.z = c.z + (o.outX ? right.z * o.outX : 0);
    o.g.position.y = o.y + ex*(o.kb + 1)*GAP + c.y;
    o.g.rotation.set(c.rx, (c.ry || 0) + (c.own || 0) + scr, c.rz);
  }
  // separation guard: two wheels closer than 212 mm (centre to centre, Ø200) are nudged apart, never through each other
  if (SHOW.on){
    const ws = [...W.values()].filter(o => !o.vanish && o.cur);
    for (let i = 0; i < ws.length; i++) for (let j = i + 1; j < ws.length; j++){
      const A = ws[i].g.position, B = ws[j].g.position; const dx = B.x - A.x, dy = B.y - A.y, dz = B.z - A.z;
      const flatA = Math.abs(ws[i].cur.rx) < .3, flatB = Math.abs(ws[j].cur.rx) < .3;
      if (flatA && flatB && Math.abs(dy) > 22) continue;                      // stacked flat wheels may sit over each other
      const d = Math.hypot(dx, dy, dz); if (d < 212 && d > .01){ const push = (212 - d) / 2, ux = dx/d, uy = dy/d, uz = dz/d; A.x -= ux*push; A.y -= uy*push*.3; A.z -= uz*push; B.x += ux*push; B.y += uy*push*.3; B.z += uz*push; }
    }
  }
  // nut + washer: in the show they fly straight up and twirl instead of retreating
  if (SHOW.on && SHOW.nut){
    const t = SHOW.nut; SHOW.nutCur = SHOW.nutCur || {y:0, sp:0};
    const k = 1 - Math.pow(.002, dt); SHOW.nutCur.y += (t.y - SHOW.nutCur.y) * k; SHOW.nutCur.sp += (t.spin - SHOW.nutCur.sp) * k;
    nut.rotation.y += SHOW.nutCur.sp * dt; washer.rotation.y += SHOW.nutCur.sp * .6 * dt;
    const H = n ? stackH() + .1*(n - 1) : SPACE;   // parks straight above the hub, clear of every path
    washer.position.set(0, H + SHOW.nutCur.y, 0); nut.position.set(0, H + SHOW.nutCur.y, 0);
    return true;
  }

}
function wake(){ idle = 0; if (SHOW.on) stopShow(); }
addEventListener('pointerdown', e => { if (e.target.closest && e.target.closest('#t-show')) { idle = 0; return; } wake(); }, {capture:true}); addEventListener('wheel', wake, {passive:true});
controls.addEventListener('start', () => { wake(); $('hint').classList.add('off'); });
setTimeout(() => $('hint').classList.add('off'), 8000);
async function keepAwake(){ try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch(e){} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
keepAwake();

/* ================================================================== loop */
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;
const tmp = new THREE.Vector3(), right = new THREE.Vector3(), back = new THREE.Vector3(), nrm = new THREE.Vector3(), qInv = new THREE.Quaternion(), qTmp = new THREE.Quaternion();
let ex = 0, sec = 0, spinV = 0, nutAside = false, nutX = 0, nutSpin = 0, last = performance.now();
function frame(now){
  const dt = Math.min((now - last)/1000, .05); last = now;
  idle += dt;
  if (!SHOW.on && idle > 60) startShow(true);
  if (SHOW.on) tickShow(dt);
  controls.autoRotate = !SHOW.on && idle > 5 && !state.section && !camFly && !drag && !drag3d && !pick;

  const k = 1 - Math.pow(.003, dt);
  ex += ((state.explode ? 1 : 0) - ex) * k;
  sec += ((state.section ? 1 : 0) - sec) * (1 - Math.pow(.02, dt));
  spinV += ((state.spin ? 1 : 0) - spinV) * (1 - Math.pow(.08, dt));
  spin.rotation.y += spinV * dt * 6;

  let yMin, yMax;
  if (state.mode === 'stack'){
    const n = state.stack.length, H = n ? stackH() + .1*(n - 1) : SPACE;   // the nut clamps the stack; with no wheels it eases back to the 80 mm mark
    qInv.copy(spin.getWorldQuaternion(qTmp)).invert();
    right.setFromMatrixColumn(camera.matrixWorld, 0); right.y = 0; right.normalize(); right.applyQuaternion(qInv);   // screen-right in arbor space
    back.set(-camera.position.x, 0, -camera.position.z).normalize().applyQuaternion(qInv);                           // away from the viewer, toward the back of the stage
    // only wheels coming onto or leaving the arbor need the nut out of the way; a reorder just slides them
    let inFlight = false; for (const o of W.values()){ if (o.entering && Math.abs(o.y - o.base) < 1.5) o.entering = false; if ((o.leaving && !o.vanish) || o.entering) inFlight = true; }
    // nut + washer retreat toward the back of the stage (smoothly) while a wheel comes or goes, then snap back over the shaft and screw down
    const aside = !SHOW.on && (nutAside || inFlight);
    nutX += ((aside ? 185 : 0) - nutX) * (1 - Math.pow(aside ? .03 : .0002, dt));
    const clear = SHOW.on || nutX > 150;
    for (const [uid, o] of W){
      if (o.vanish){ const sc = o.g.scale.x * Math.pow(.0005, dt); o.g.scale.setScalar(sc); o.g.position.y += 40*dt; if (sc < .03){ spin.remove(o.g); disposeTree(o.g); W.delete(uid); } continue; }
      if (!drag3d || drag3d.uid !== uid){ if (o.outX){ o.outX *= Math.pow(.001, dt); if (Math.abs(o.outX) < .2) o.outX = 0; o.g.position.x = right.x * o.outX; o.g.position.z = right.z * o.outX; } }
      if (o.leaving){ if (clear || o.y > H + 30){ o.y += (o.base - o.y) * (1 - Math.pow(.003, dt)) + 60*dt; } o.g.position.y = o.y; if (o.y > o.base - 12){ spin.remove(o.g); disposeTree(o.g); W.delete(uid); } continue; }
      if (!o.entering || clear) o.y += (o.base - o.y) * (1 - Math.pow(.0008, dt));
      o.g.position.y = o.y + ex*(o.kb + 1)*GAP; }
    const posed = applyPoses(dt);
    const prevW = washerY, hover = nutX > 2 ? 34 : 0;
    washerY += (H + hover - washerY) * (1 - Math.pow(hover ? .002 : .00002, dt));
    if (!hover && washerY > H + .05) nutSpin -= (prevW - washerY) * .9;                // screwing down
    nut.rotation.y = nutSpin;
    // the shaft always ends flush with the nut
    if (Math.abs(H - shaftH) > .25){ const h = shaftH + (H - shaftH) * (1 - Math.pow(.0008, dt)); spin.remove(shaft); disposeTree(shaft); shaft = buildShaft(h); spin.add(shaft); shaftH = h; }
    if (!posed){ washer.position.set(back.x*nutX, washerY + ex*(n + 1)*GAP, back.z*nutX); nut.position.set(back.x*nutX, washerY + ex*(n + 2.3)*GAP, back.z*nutX); }
    yMin = -67; yMax = Math.max(H, shaftH) + 17 + ex*(n + 2.3)*GAP + hover;
    for (const o of W.values()){ if (!o.leaving && o.y > o.base + 1.5) yMax = Math.max(yMax, o.y + WHEELS[o.type].t); if (SHOW.on && o.cur) yMax = Math.max(yMax, o.y + o.cur.y + 30); }   // keep flying wheels in frame
    const so = state.sel && W.get(state.sel);
    if (pick && pick.on && dropSlot >= 0){ let hy = 0; for (let i = n - 1; i >= dropSlot; i--) hy += WHEELS[state.stack[i].type].t; halo.visible = true; halo.position.y = hy; halo.material.opacity = .9; }
    else { halo.visible = !!so; if (so){ halo.position.y = so.g.position.y + WHEELS[so.type].t/2; halo.material.opacity = .55 + .35*Math.sin(now/260); } }
  } else { yMin = 0; yMax = WHEELS[state.single].t; if (single) single.position.y = 0; }
  const c = (yMin + yMax)/2; viewC += (c - viewC) * k;
  root.position.y = -viewC * MM;
  viewR = Math.hypot(100, (yMax - yMin)/2) * MM;
  shadow.position.y = (yMin - viewC) * MM - .02;
  shadow.scale.setScalar(viewR * 2.6); shadow.material.opacity = 1 - sec;

  nrm.set(-camera.position.x, 0, -camera.position.z); if (nrm.lengthSq() < 1e-6) nrm.set(0,0,-1); nrm.normalize();
  sectionPlane.normal.copy(nrm); sectionPlane.constant = (1 - ease(sec)) * viewR * 1.6 + .0005;

  if (camFly && !SHOW.on){

    camFly.t += dt / camFly.dur; const t = ease(Math.min(1, camFly.t));
    camera.position.lerpVectors(camFly.from, camFly.to, t); controls.target.copy(camFly.tFrom).multiplyScalar(1 - t);
    if (camFly.t >= 1) camFly = null;
  }
  applyLayout(dt);
  controls.minDistance = viewR * 1.6; controls.maxDistance = viewR * 8;
  if (!SHOW.on) controls.update();
  renderer.render(scene, camera);

  if (labels.length){
    const w = innerWidth, h = innerHeight, show = ex > .6 && !state.section;
    right.setFromMatrixColumn(camera.matrixWorld, 0); right.y = 0; right.normalize();
    qInv.copy(spin.getWorldQuaternion(qTmp)).invert(); right.applyQuaternion(qInv);
    labels.forEach(L => { const p = L.get(); if (!p){ L.el.style.opacity = 0; return; }
      tmp.set(right.x * p[0], p[1], right.z * p[0]); spin.localToWorld(tmp); tmp.project(camera);
      L.el.style.transform = `translate(${(tmp.x*.5 + .5)*w}px, ${(-tmp.y*.5 + .5)*h}px)`;
      L.el.style.opacity = show ? Math.min(1, (ex - .6)*4) : 0; });
  }
  requestAnimationFrame(frame);
}

/* ================================================================== boot */
try { await Promise.race([Promise.all([document.fonts.load('600 20px Archivo'), document.fonts.load('700 20px Archivo')]), new Promise(r => setTimeout(r, 2500))]); } catch(e){}
thumbs = makeThumbs();
$('strip').innerHTML = `<button class="card hero" data-k="stack"><img src="${thumbs.stack}" alt="" draggable="false"><b></b><small></small></button>` + ORDER.map(k => `<button class="card" data-k="${k}"><img src="${thumbs[k]}" alt="" draggable="false"><b></b><small></small></button>`).join('');
/* catalogue cards: one tap drops the wheel onto the arbor, a double tap opens its sheet, a drag carries it to the arbor */
let tapT = 0, tapK = null;
function addFromCatalogue(k){
  if (state.mode !== 'stack'){ enterMode('stack', true); flyHome(); }
  if (!fits(WHEELS[k].t)){ toast(T().full); return; }
  setTool('explode', false); setTool('section', false);
  const it = mk(k); state.stack.unshift(it); state.sel = it.uid; syncStack(false); toast(T().added(code(k)));
}
function openSingle(k){ state.single = k; setTool('explode', false); enterMode('single'); if (!isOpen('l')) setOpen('l', true); flyHome(); }
document.querySelectorAll('.card').forEach(c => c.onclick = () => {
  if (cardBlock){ cardBlock = false; return; }
  closeSheet();
  const k = c.dataset.k;
  if (k === 'stack'){ if (state.mode !== 'stack'){ enterMode('stack', true); flyHome(); } return; }
  if (tapK === k){ clearTimeout(tapT); tapK = null; openSingle(k); return; }           // double tap
  tapK = k; clearTimeout(tapT); tapT = setTimeout(() => { tapK = null; addFromCatalogue(k); }, 280);
});
resize();
camera.position.copy(VIEW_DIR).multiplyScalar(14);
enterMode('stack', true);
renderUI();
flyHome();
requestAnimationFrame(t => { last = t; frame(t); setTimeout(() => $('loading').classList.add('done'), 250); });
</script>
